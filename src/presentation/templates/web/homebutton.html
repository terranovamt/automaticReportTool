<a
  href="../index.html"
  style="display: inline-flex; align-items: center; gap: 12px; padding: 20px 30px; background: #ffd200; border: none; border-radius: 20px; inset 0 1px 0 rgba(255, 255, 255, 0.1); text-decoration: none; color: #03234b; font-weight: 600; font-size: 18px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; overflow: hidden"
  onmouseover="this.style.transform='translateY(-3px) scale(1.05)'; 
                     
                    this.querySelector('.home-icon').style.transform='scale(1.1)'; 
                    this.querySelector('.home-text').style.color='#03234b';
                    this.querySelector('.home-text').style.transform='translateY(-1px)';"
  onmouseout="this.style.transform='none'; 
                   
                   this.querySelector('.home-icon').style.transform='none'; 
                   this.querySelector('.home-text').style.color='#03234b';
                   this.querySelector('.home-text').style.transform='none';"
  onmousedown="this.style.transform='translateY(-1px) scale(1.02)'; 
                    "
  onmouseup="this.style.transform='translateY(-3px) scale(1.05)';">
  <svg
    class="home-icon"
    style="width: 40px; height: 40px; transition: all 0.3s ease"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
    fill="none">
    <path
      d="M1 6V15H6V11C6 9.89543 6.89543 9 8 9C9.10457 9 10 9.89543 10 11V15H15V6L8 0L1 6Z"
      fill="currentColor" />
  </svg>

  <span
    class="home-text"
    style="margin: 0; font-size: 18px; font-weight: 600; color: #03234b; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); letter-spacing: 0.5px; transition: all 0.3s ease"
    >Home</span
  >
</a>
